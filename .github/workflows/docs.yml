# Builds the docs site (with the Flutter gallery compiled for the web) and
# deploys it to GitHub Pages: https://stupidly-logical.github.io/sticker-pop/
# Runs on every push to main, and by hand from the Actions tab.
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: 3.50.0, channel: stable }
      - run: node tools/check-site.mjs
      - run: node tools/build-site.mjs
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist/site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
