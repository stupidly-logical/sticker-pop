# Pushing a tag like v0.2.0 creates a GitHub Release whose notes are that
# version's section of CHANGELOG.md, then publishes the web package to npm,
# the Flutter package to pub.dev and the Compose library to Maven Central. CI (ci.yml) builds and tests the tag.
# SwiftUI needs nothing more: Swift Package Manager installs from the tag.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Versions match the tag
        run: node tools/check-version.mjs --tag "$GITHUB_REF_NAME"
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## "v"( |$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG.md section for $version"; exit 1; }
      - name: Create the release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "$GITHUB_REF_NAME" --title "Sticker Pop $GITHUB_REF_NAME" --notes-file notes.md --verify-tag

  # npm: trusted publishing (no token). Set it up once on npmjs.com:
  # package settings › Trusted publisher › GitHub Actions,
  # repo stupidly-logical/sticker-pop, workflow release.yml.
  npm:
    needs: release
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, registry-url: 'https://registry.npmjs.org' }
      - run: npm install -g npm@latest   # trusted publishing needs npm 11.5.1+
      - name: Publish @sticker-pop/web
        working-directory: packages/web
        run: |
          version="$(node -p "require('./package.json').version")"
          if ! npm view @sticker-pop/web name >/dev/null 2>&1; then
            echo "::notice::@sticker-pop/web isn't on npm yet; publish it once by hand (README: First release on the registries)"; exit 0
          fi
          if npm view "@sticker-pop/web@$version" version >/dev/null 2>&1; then
            echo "@sticker-pop/web $version is already on npm"; exit 0
          fi
          npm publish

  # pub.dev: automated publishing (no token). Set it up once on pub.dev:
  # package Admin › Automated publishing › GitHub Actions,
  # repo stupidly-logical/sticker-pop, tag pattern v{{version}}.
  pubdev:
    needs: release
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1   # fetches the pub.dev token for this run
      - uses: subosito/flutter-action@v2
        with: { flutter-version: 3.50.0, channel: stable }
      - name: Publish sticker_pop
        working-directory: packages/flutter/sticker_pop
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! curl -sf https://pub.dev/api/packages/sticker_pop >/dev/null; then
            echo "::notice::sticker_pop isn't on pub.dev yet; publish it once by hand (README: First release on the registries)"; exit 0
          fi
          if curl -sf "https://pub.dev/api/packages/sticker_pop/versions/$version" >/dev/null; then
            echo "sticker_pop $version is already on pub.dev"; exit 0
          fi
          flutter pub get
          flutter pub publish --force

  # Maven Central: needs four repository secrets (README: First release on
  # the registries). Until they're set, this job leaves a note and skips.
  maven:
    needs: release
    runs-on: ubuntu-latest
    permissions: { contents: read }
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Publish io.github.stupidly-logical:stickerpop
        working-directory: packages/android
        run: |
          if [ -z "$ORG_GRADLE_PROJECT_mavenCentralUsername" ] || [ -z "$ORG_GRADLE_PROJECT_signingInMemoryKey" ]; then
            echo "::notice::Maven Central secrets aren't set yet; skipping (README: First release on the registries)"; exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          if curl -sf "https://repo1.maven.org/maven2/io/github/stupidly-logical/stickerpop/$version/stickerpop-$version.pom" >/dev/null; then
            echo "stickerpop $version is already on Maven Central"; exit 0
          fi
          ./gradlew :stickerpop:publishToMavenCentral --no-configuration-cache
